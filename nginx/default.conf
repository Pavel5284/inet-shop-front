server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Проверка живости для Docker healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # GraphQL API -> бэкенд. Браузер видит один адрес (тот же домен), поэтому CORS не нужен.
    location /graphql {
        # 127.0.0.11 — встроенный DNS Docker. Имя берётся в момент запроса, поэтому nginx стартует,
        # даже если бэкенд ещё не поднялся, и переживает его перезапуск.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        include /etc/nginx/security-headers.conf;
    }

    # Файлы с хешем в имени можно кэшировать «навсегда»
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Всё остальное — одностраничное приложение: неизвестные пути отдают index.html (роутинг делает React)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
